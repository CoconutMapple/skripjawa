<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Manajemen Produk - Tugas 5 JS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #667eea;
            text-align: center;
            margin-bottom: 30px;
            font-size: 2em;
        }
        
        .section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
        }
        
        h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .input-group {
            margin-bottom: 15px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-top: 10px;
            width: 100%;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        #output {
            margin-top: 30px;
            padding: 20px;
            background: white;
            border-radius: 10px;
            border: 2px solid #667eea;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        
        th {
            background: #667eea;
            color: white;
            padding: 12px;
            text-align: left;
        }
        
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .badge {
            display: inline-block;
            background: #28a745;
            color: white;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-left: 10px;
        }
        
        .info {
            background: #e7f3ff;
            border-left: 4px solid #2196F3;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 5px;
        }
        
        .info strong {
            color: #2196F3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🛒 Sistem Manajemen Produk Toko Online</h1>
        
        <div class="info">
            <strong>📚 Fitur yang Digunakan:</strong> Event Listener, Destructuring, Spread Operator, Rest Parameter
        </div>
        
        <div class="section">
            <h2>➕ Tambah Produk</h2>
            <div class="input-group">
                <input type="number" id="produkId" placeholder="ID Produk (contoh: 6)">
            </div>
            <div class="input-group">
                <input type="text" id="produkNama" placeholder="Nama Produk (contoh: Keyboard Gaming)">
            </div>
            <div class="input-group">
                <input type="number" id="produkHarga" placeholder="Harga (contoh: 850000)">
            </div>
            <button id="btnTambah">✅ Tambah Produk</button>
        </div>
        
        <div class="section">
            <h2>🗑️ Hapus Produk</h2>
            <div class="input-group">
                <input type="text" id="hapusId" placeholder="ID Produk (bisa multiple, pisahkan dengan koma. Contoh: 1,3,5)">
            </div>
            <button id="btnHapus">❌ Hapus Produk</button>
        </div>
        
        <div class="section">
            <button id="btnTampilkan">📊 Refresh Tampilan Produk</button>
        </div>
        
        <div id="output">
            <h2>📦 Daftar Produk <span class="badge">Loading...</span></h2>
        </div>
    </div>
    
    <script src="manajemen_produk_browser.js"></script>
</body>
</html>
